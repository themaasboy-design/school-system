<body>

    <img src="logo.png" alt="شعار الوزارة" class="navbar-logo">
    <div class="navbar-links">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html">الانتظار</a>
        <a href="/monitoring">الإشراف</a>
        <a href="accountability.html" class="active">المساءلة</a>
        <a href="/login.html" class="logout">تسجيل الخروج</a>

<div class="container-fluid px-lg-5 my-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">نظام إدارة المساءلات والإفادات</h2>
        <p class="text-muted">تسجيل مخالفات المعلمين وحفظها مباشرة في قاعدة البيانات</p>
    </div>

    <div class="row g-4">
        <!-- 1️⃣ نموذج إضافة المساءلة -->
        <div class="col-12 col-lg-4">
            <div class="card p-4 shadow-sm border-0 rounded-3">
                <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">📝 إصدار مساءلة جديدة</h5>
                
                <form id="accountabilityForm">
                    <!-- اسم المعلم -->

                        <label class="form-label fw-bold">اسم المعلم:</label>

                    <!-- نوع الحالة / المساءلة -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">نوع الحالة / المساءلة:</label>
                        <select id="violationType" class="form-select" required>
                            <option value="">-- اختر نوع المساءلة --</option>
                            <option value="التأخر عن الطابور الصباحي">التأخر عن الطابور الصباحي</option>
                            <option value="التأخر عن الحصة الدراسية">التأخر عن الحصة الدراسية</option>
                            <option value="التأخر عن إشراف الفسحة">التأخر عن إشراف الفسحة</option>
                            <option value="التأخر عن إشراف الصلاة">التأخر عن إشراف الصلاة</option>
                            <option value="التأخر عن حصة الانتظار">التأخر عن حصة الانتظار</option>
                            <option value="الخروج قبل نهاية الحصة الدراسية">الخروج قبل نهاية الحصة الدراسية</option>
                            <option value="الغياب عن الحصة الدراسية">الغياب عن الحصة الدراسية</option>
                            <option value="الغياب عن حصة الانتظار">الغياب عن حصة الانتظار</option>
                            <option value="عدم التواجد أثناء الدوام">عدم التواجد أثناء الدوام</option>
                            <option value="عدم الإشراف على الصلاة">عدم الإشراف على الصلاة</option>
                            <option value="عدم الإشراف في الفسحة">عدم الإشراف في الفسحة</option>
                            <option value="عدم حضور الطابور الصباحي">عدم حضور الطابور الصباحي</option>
                            <option value="عدم حضور المناوبة الصباحية">عدم حضور المناوبة الصباحية</option>
                            <option value="عدم حضور المناوبة المسائية">عدم حضور المناوبة المسائية</option>
                        </select>
                    </div>

                    <!-- مدة التأخير بالدقائق -->
                    <div class="mb-3 d-none" id="delayMinutesContainer">
                        <label class="form-label fw-bold text-danger">مدة التأخير (بالدقائق):</label>
                        <input type="number" id="delayMinutes" class="form-control" min="1" placeholder="مثال: 15">
                    </div>

                    <!-- اختيار التاريخ بالتقويم الهجري (نفس تقويم report.html) -->
                    <div class="mb-3" style="position: relative;">
                        <label class="form-label fw-bold">اختر التاريخ الهجري (من التقويم):</label>
                        <input type="text"
                               id="hijriPicker"
                               class="form-control"
                               placeholder="اختر التاريخ الهجري"
                               autocomplete="off"
                               required>
                    </div>

                    <!-- التفاصيل / الملاحظات -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">تفاصيل أو ملاحظات إضافية:</label>
                        <textarea id="details" class="form-control" rows="3" placeholder="اكتب التفاصيل هنا (اختياري)..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">حفظ المساءلة 💾</button>
                </form>
            </div>
        </div>

        <!-- 2️⃣ جدول عرض المساءلات المسجلة -->
        <div class="col-12 col-lg-8">
            <div class="card p-4 shadow-sm border-0 rounded-3">
                <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">📋 سجل المساءلات المحفوظة</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>اسم المعلم</th>
                                <th>نوع المساءلة</th>
                                <th>مدة التأخير</th>
                                <th>التاريخ الهجري</th>
                                <th>التقرير</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTableBody">
                            <tr><td colspan="6" class="text-muted">جاري تحميل البيانات...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- المكتبات البرمجية -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-hijri-datepicker@1.0.2/dist/js/bootstrap-hijri-datetimepicker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
    // 🔢 تحويل الأرقام العربية الشرقية (٠-٩) إلى أرقام غربية (0-9)
    function toWesternDigits(str) {
        if (str === null || str === undefined) return '';
        return str.toString().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    // 📅 استخراج أرقام التاريخ فقط وإعادة تركيبها بصيغة نظيفة YYYY/MM/DD بأرقام غربية
    function cleanDateYMD(str) {
        if (!str) return '';
        const westernized = toWesternDigits(str);
        const groups = westernized.match(/\d+/g);
        if (!groups || groups.length === 0) return '';
        return groups.join('/');
    }

    // 📆 اسم اليوم بالعربي من تاريخ هجري (YYYY/MM/DD بأرقام غربية)
    function getArabicDayName(hijriDateStr) {
        const dayNames = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        try {
            const clean = cleanDateYMD(hijriDateStr);
            const m = moment(clean, 'iYYYY/iMM/iDD');
            if (m.isValid()) return dayNames[m.day()];
        } catch (e) { /* تجاهل */ }
        return '';
    }

    // 0️⃣ جلب اسم المدرسة
    async function loadSchoolName() {
        try {
            const response = await fetch('/get-report-data');
            const data = await response.json();
            if (data.mainInfo && data.mainInfo.B2) {
                document.getElementById('schoolName').textContent = "مدرسة " + data.mainInfo.B2;
            } else {
                document.getElementById('schoolName').textContent = "المدرسة";
            }
        } catch (e) {
            console.error("خطأ في جلب اسم المدرسة:", e);
            document.getElementById('schoolName').textContent = "المدرسة";
        }
    }

    // 2️⃣ إظهار / إخفاء حقل مدة التأخير
    const violationSelect = document.getElementById('violationType');
    const delayContainer = document.getElementById('delayMinutesContainer');
    const delayInput = document.getElementById('delayMinutes');

    violationSelect.addEventListener('change', () => {
        const val = violationSelect.value;
        if (val.includes("التأخر")) {
            delayContainer.classList.remove('d-none');
            delayInput.required = true;
        } else {
            delayContainer.classList.add('d-none');
            delayInput.required = false;
            delayInput.value = "";
        }
    });

    // 3️⃣ جلب قائمة المعلمين
    async function loadTeachers() {
        try {
            const res = await fetch('/get-monitoring-teachers');
            const data = await res.json();
            const select = document.getElementById('teacherSelect');
            
            let teachersList = [];
            if (Array.isArray(data)) teachersList = data;
            else if (data && Array.isArray(data.teachers)) teachersList = data.teachers;
            else if (data && Array.isArray(data.data)) teachersList = data.data;

            select.innerHTML = '<option value="">-- اختر المعلم --</option>';

            if (teachersList.length > 0) {
                teachersList.forEach(t => {
                    const name = typeof t === 'string' ? t.trim() : (t.name || t['اسم المعلم'] || t.teacher_name);
                    if (name) {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    }
                });
            }
        } catch (e) {
            console.error("خطأ في تحميل المعلمين:", e);
        }
    }

    // 4️⃣ جلب سجلات المساءلات
    let accountabilityRecords = [];

    async function loadAccountabilityRecords() {
        try {
            const res = await fetch('/api/accountability');
            const result = await res.json();
            const tbody = document.getElementById('recordsTableBody');

            let recordsList = [];
            if (Array.isArray(result)) recordsList = result;
            else if (result && Array.isArray(result.data)) recordsList = result.data;
            else if (result && Array.isArray(result.records)) recordsList = result.records;

            accountabilityRecords = recordsList;

            if (recordsList.length > 0) {
                tbody.innerHTML = "";
                recordsList.forEach((item, index) => {
                    const delayVal = item.delay_minutes || item.delay || 0;
                    const delayText = delayVal > 0 ? `${delayVal} دقيقة` : '-';
                    const recordId = item._id || item.id || index;
                    const teacherName = item.teacher_name || item.teacher || item['اسم المعلم'] || '-';
                    const violationType = item.violation_type || item.violation || item['نوع المساءلة'] || '-';
                    const hijriDate = item.hijri_date || item.date || item['التاريخ الهجري'] || item['التاريخ'] || '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${index + 1}</td>
                        <td class="fw-bold">${teacherName}</td>
                        <td><span class="badge bg-danger p-2">${violationType}</span></td>
                        <td>${delayText}</td>
                        <td>${hijriDate}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary fw-bold px-3" onclick="printAccountabilityReport('${recordId}')">
                                🖨️ طباعة
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="text-muted py-3">لا توجد مساءلات مسجلة في قاعدة البيانات</td></tr>`;
            }
        } catch (e) {
            const tbody = document.getElementById('recordsTableBody');
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-danger py-3">خطأ في جلب البيانات من السيرفر</td></tr>`;
            }
        }
    }

    // 🖨️ طباعة تقرير المساءلة الكامل (PDF)
    async function printAccountabilityReport(id) {
        const record = accountabilityRecords.find((r, idx) => (r._id || r.id || idx) == id);
        if (!record) {
            Toastify({ text: "لم يتم العثور على بيانات السجل", style: { background: "#e74c3c" } }).showToast();
            return;
        }

        const teacherName = record.teacher_name || record.teacher || record['اسم المعلم'] || '';
        const violationType = record.violation_type || record.violation || record['نوع المساءلة'] || '';
        const delayMinutes = parseInt(record.delay_minutes || record.delay || 0) || 0;
        const hijriDateRaw = record.hijri_date || record.date || record['التاريخ الهجري'] || '';
        const hijriDate = cleanDateYMD(hijriDateRaw);
        const dayName = getArabicDayName(hijriDateRaw);

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        // ===== رأس الصفحة =====
        const res = await fetch('/get-report-data');
        const fullResponse = await res.json();
        const mainInfo = fullResponse.mainInfo || {};

        try {
            const fontData = await fetch('NotoSansArabic-Regular.ttf').then(res => res.arrayBuffer());
            const fontBase64 = btoa(new Uint8Array(fontData).reduce((data, byte) => data + String.fromCharCode(byte), ''));

            doc.addFileToVFS("NotoSansArabic-Regular.ttf", fontBase64);
            doc.addFont("NotoSansArabic-Regular.ttf", "Noto", "normal");
            doc.setFont("Noto", "normal");
        } catch (e) {
            console.warn("تعذر تحميل الخط الخاص، سيتم استخدام الخط الافتراضي", e);
        }

        try {
            const img = new Image();
            img.src = 'logo.png';
            await img.decode();
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', 70, 0, 70, 50);
        } catch (e) {
            console.warn("لم يتم العثور على صورة الشعار logo.png");
        }

        doc.setFontSize(12);
        doc.text("المملكة العربية السعودية - وزارة التعليم", 170, 15, { align: 'center' });
        doc.text("الإدارة العامة للتعليم بمنطقة " + toWesternDigits(mainInfo.B1 || ""), 170, 21, { align: 'center' });
        doc.text("مدرسة " + toWesternDigits(mainInfo.B2 || ""), 170, 27, { align: 'center' });
        doc.line(15, 35, 195, 35);

        const fontName = doc.getFontList().Noto ? 'Noto' : 'helvetica';
        const RX = 195;        // أقصى يمين لمحاذاة النص
        const maxW = 180;      // العرض الأقصى للنص قبل اللف
        let y = 45;

        // دالة مساعدة: طباعة نص RTL مع لف تلقائي، وترجع y الجديد
        function printRTLLine(text, fontSize = 11, gapAfter = 7) {
            doc.setFontSize(fontSize);
            const lines = doc.splitTextToSize(text, maxW);
            lines.forEach(line => {
                if (y > 280) { doc.addPage(); y = 20; }
                doc.text(line, RX, y, { align: 'right' });
                y += 6;
            });
            y += (gapAfter - 6);
        }

        // ===== عنوان "مسائلة" =====
        doc.setFontSize(16);
        doc.setFont(fontName, 'normal');
        doc.text("مسائلة", 105, y, { align: 'center' });
        y += 10;

        // ===== جدول بيانات المعلم (رقم الهوية - اسم المعلم - التخصص - العمل الحالي) =====
        let teacherRow = null;
        try {
            const rawRes = await fetch('/api/teachers-raw');
            const rawTeachers = await rawRes.json();
            teacherRow = (Array.isArray(rawTeachers) ? rawTeachers : []).find(row =>
                row && row[1] && row[1].toString().trim() === teacherName.toString().trim()
            );
        } catch (e) {
            console.warn("تعذر جلب بيانات المعلم الكاملة", e);
        }

        const nationalId = teacherRow ? toWesternDigits(teacherRow[0] || '') : '';
        const specialization = teacherRow ? (teacherRow[3] || '') : '';
        const currentJob = teacherRow ? (teacherRow[4] || '') : '';

        doc.autoTable({
            startY: y,
            theme: 'grid',
            head: [['العمل الحالي', 'التخصص', 'اسم المعلم', 'رقم الهوية']],
            body: [[currentJob, specialization, teacherName, nationalId]],
            styles: {
                font: fontName, halign: 'center', fontSize: 10, cellPadding: 3,
                textColor: [0, 0, 0], lineColor: [0, 0, 0], lineWidth: 0.2, fillColor: [255, 255, 255]
            },
            headStyles: { fillColor: [230, 230, 230], textColor: [0, 0, 0], fontStyle: 'bold', lineColor: [0, 0, 0], lineWidth: 0.2 },
            margin: { left: 15, right: 15 }
        });

        y = doc.lastAutoTable.finalY + 12;

        // ===== طلب إفادة =====
        doc.setFontSize(14);
        doc.text("طلب إفادة", 105, y, { align: 'center' });
        y += 10;

        printRTLLine(`المكرم: ${teacherName}`, 12);
        printRTLLine("السلام عليكم ورحمة الله وبركاته      وبعد", 11);

        let line3 = `من خلال متابعة سير العمل ليوم : ${dayName} الموافق ${hijriDate} لوحظ عليكم ما يلي ${violationType}`;
        if (delayMinutes > 0) {
            line3 += ` بإجمالي عدد دقائق ${delayMinutes}`;
        }
        printRTLLine(line3, 11);

        printRTLLine("عليه نأمل توضيح أسباب ذلك مع إرفاق ما يؤيد عذركم ،،، ولكم تحياتي", 11);
        y += 4;

        printRTLLine(`مدير المدرسة : ${toWesternDigits(mainInfo.B3 || "")}     التاريخ: ${hijriDate}     التوقيع:.............................`, 11);

        // ===== الإفادة =====
        y += 8;
        if (y > 260) { doc.addPage(); y = 20; }
        doc.setFontSize(14);
        doc.text("الإفادة", 105, y, { align: 'center' });
        y += 10;

        printRTLLine(`المكرم مدير : ${toWesternDigits(mainInfo.B2 || "")} حفظه الله`, 12);
        printRTLLine("السلام عليكم ورحمة الله وبركاته        وبعد", 11);
        printRTLLine("أفيدكم أن أسباب ذلك ما يلي:", 11);

        // ثلاثة أسطر فارغة رمادية للكتابة اليدوية
        doc.setDrawColor(180, 180, 180);
        doc.setLineWidth(0.4);
        for (let i = 0; i < 3; i++) {
            if (y > 280) { doc.addPage(); y = 20; }
            doc.line(15, y, 195, y);
            y += 8;
        }
        doc.setDrawColor(0, 0, 0);
        y += 2;

        printRTLLine("الاسم :........................................................... التاريخ:....................... التوقيع:........................", 11);

        // ===== قرار مدير المدرسة =====
        y += 8;
        if (y > 250) { doc.addPage(); y = 20; }
        doc.setFontSize(14);
        doc.text("مدير المدرسة", 105, y, { align: 'center' });
        y += 10;

        // مربعات اختيار (☐) مرسومة يدوياً بدل رمز يونيكود لضمان ظهورها بكل الخطوط
        doc.setFontSize(11);
        doc.setDrawColor(0, 0, 0);

        doc.rect(RX - 4, y - 4, 4, 4);
        doc.text("عذر مقبول", RX - 8, y, { align: 'right' });
        y += 9;

        doc.rect(RX - 4, y - 4, 4, 4);
        doc.text("عذر غير مقبول وتحتسب من ضمن دقائق التأخر.", RX - 8, y, { align: 'right' });
        y += 10;

        printRTLLine(`مدير المدرسة : ${toWesternDigits(mainInfo.B3 || "")} التاريخ:............................. التوقيع :........................................`, 11);

        // ===== صفحة أخيرة: ملحوظات هامة =====
        doc.addPage();
        let noteY = 30;
        doc.setFontSize(11);
        doc.text("ملحوظات هامة :", RX, noteY, { align: 'right' });
        noteY += 8;

        const notes = [
            "- تستكمل الاستمارة من المدير المباشر وإصدار قرار بموجبه .",
            "- إذا سبق الإجازة نهاية الأسبوع غياب وألحقها غياب تحتسب مدة الغياب كاملة .",
            "- يجب أن يوضح المتغيب أسباب غيابه فور تسلمه الاستمارة ويعيدها لمديره المباشر.",
            "- يعطى المتغيب مدة أسبوع لتقديم ما يؤيد عذره فإذا انقضت المدة الزمنية تستكمل الاستمارة ويتم الحسم ."
        ];

        doc.setFontSize(9);
        notes.forEach(note => {
            const wrapped = doc.splitTextToSize(note, maxW);
            wrapped.forEach(line => {
                doc.text(line, RX, noteY, { align: 'right' });
                noteY += 6;
            });
        });

        // ===== حفظ الملف باسم المعلم =====
        const safeTeacherName = teacherName ? teacherName.toString().trim().replace(/[\\/:*?"<>|]/g, '-') : 'تقرير';
        doc.save(`${safeTeacherName}.pdf`);
    }

    // 5️⃣ حفظ المساءلة الجديدة
    document.getElementById('accountabilityForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            teacher_name: document.getElementById('teacherSelect').value,
            violation_type: document.getElementById('violationType').value,
            delay_minutes: document.getElementById('delayMinutes').value || 0,
            hijri_date: document.getElementById('hijriPicker').value,
            details: document.getElementById('details').value
        };

        try {
            const res = await fetch('/api/accountability', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            if (result.success || res.ok) {
                Toastify({
                    text: result.message || "تم حفظ المساءلة بنجاح",
                    duration: 3000,
                    style: { background: "linear-gradient(to left, #2ecc71, #27ae60)" }
                }).showToast();

                document.getElementById('accountabilityForm').reset();
                delayContainer.classList.add('d-none');
                $('#hijriPicker').val(moment().format('iYYYY/iMM/iDD'));
                
                loadAccountabilityRecords();
            } else {
                Toastify({
                    text: "خطأ: " + (result.error || "فشل الحفظ"),
                    style: { background: "#e74c3c" }
                }).showToast();
            }
        } catch (err) {
            Toastify({ text: "فشل الاتصال بالسيرفر", style: { background: "#e74c3c" } }).showToast();
        }
    });

    // التشغيل عند تحميل الصفحة
    $(document).ready(() => {
        loadSchoolName();
        loadTeachers();
        loadAccountabilityRecords();

        $("#hijriPicker").hijriDatePicker({
            hijri: true,
            showSwitcher: false,
            format: 'iYYYY/iMM/iDD',
            hijriFormat: 'iYYYY/iMM/iDD',
            locale: 'ar-sa'
        }).on('dp.change change input', function () {
            this.value = toWesternDigits(this.value);
        });
    });
</script>
</body>
</html>
