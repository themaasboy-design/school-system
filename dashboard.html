<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانتظار</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-hijri-datepicker@1.0.2/dist/css/bootstrap-datetimepicker.min.css">
    <style>
        .hijri-datepicker-container,.datepicker { z-index: 99999 !important; }
        .secondary-teacher-select {
            margin-top: 8px;
            display: none;
            border-color: #3498db;
            background-color: #f8f9fa;
        }
    </style>
    <!-- ملف الستايل الخاص بالرسائل (CSS) -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- ملف التشغيل الخاص بالرسائل (JavaScript) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
 <nav class="navbar">
    <h2 id="schoolName">المدرسة </h2>
    <img src="logo.png" alt="شعار الوزارة" class="navbar-logo">

    <!-- 🍔 زر القائمة للجوال -->
    <button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة">
        <i class="fas fa-bars"></i>
    </button>

    <!-- روابط الشريط -->
    <div class="navbar-links" id="navbarLinks">
        <a href="index.html">الرئيسية</a>
        <a href="dashboard.html#">الانتظار</a>
        <a href="/monitoring">الإشراف</a>
        
        <div class="dropdown-container">
            <a href="#" class="dropdown-trigger">التقارير</a>
            <div class="dropdown-menu">
                <a href="report.html">تقرير الغياب</a>
                <a href="reportmoni.html">تقرير الإشراف</a>
            </div>
        </div>
        <div class="dropdown-container">
            <a href="#" class="dropdown-trigger" style="color: white; padding-bottom: 5px; display: inline-block;">إعدادات</a>
            <div class="dropdown-menu">
                <a class="nav-link" href="updata_school.html"> جلب بيانات المدرسة </a>       
                <a href="waiting_setting.html"> إعداد جدول الانتظار </a>
            </div>
        </div>
        <a href="/login.html" class="logout">تسجيل الخروج</a>
    </div>
</nav>

    <div class="main-container">
        <div class="card">
            <form id="absenceForm">
                <h3>تسجيل غياب المعلمين وتوزيع الانتظار</h3>
                
                <label>اختر المعلم الغائب:</label>
                <select id="teacherSelect" required>
                    <option value="">-- اختر اسم المعلم الغائب --</option>
                </select>

                <div class="form-row">
                    <div class="form-group">
                        <label>اليوم:</label>
                        <select id="daySelect" required>
                            <option value="">-- اختر اليوم --</option>
                            <option value="الأحد">الأحد</option>
                            <option value="الاثنين">الاثنين</option>
                            <option value="الثلاثاء">الثلاثاء</option>
                            <option value="الأربعاء">الأربعاء</option>
                            <option value="الخميس">الخميس</option>
                        </select>
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label>التاريخ :</label>
                        <input type="text" id="hijriDate" class="form-control" placeholder="اختر التاريخ الهجري" autocomplete="off" required>
                    </div>
                </div>

                <h3 style="margin-top: 40px;">توزيع حصص الانتظار</h3>
                <div class="classes-grid" id="classesContainer"></div>

                <button type="submit">حفظ</button>
            </form>
        </div>
    </div>

    <script>
        let allTeachersList = [];

        const container = document.getElementById('classesContainer');
        for(let i=1; i<=7; i++) {
            container.innerHTML += `
                <div class="class-box">
                    <label>الحصة ${i}:</label>
                    <select name="class${i}_room" id="roomSelect_${i}" onchange="checkAndEnableTeacher(${i})">
                        <option value="">-- اختر الفصل --</option>
                    </select>
                    <select name="class${i}_teacher" id="teacherSelect_${i}" disabled onchange="handleTeacherSelectChange(${i})">
                        <option value="">-- اختر الفصل أولاً --</option>
                    </select>
                    <select id="allTeacherSelect_${i}" class="secondary-teacher-select">
                        <option value="">-- اختر المعلم --</option>
                    </select>
                </div>
            `;
        }

        document.getElementById('absenceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reportData = {
                date: document.getElementById('hijriDate').value,
                day: document.getElementById('daySelect').value,
                absentTeacher: document.getElementById('teacherSelect').value
            };

            for(let i=1; i<=7; i++) {
                reportData[`class${i}_room`] = document.getElementById(`roomSelect_${i}`).value;
                
                let selectedTeacher = document.getElementById(`teacherSelect_${i}`).value;
                // إذا كان خيار المستخدم "معلم بديل آخر"، نأخذ القيمة من قائمة المعلمين الثانية
                if (selectedTeacher === "معلم بديل آخر") {
                    const altTeacher = document.getElementById(`allTeacherSelect_${i}`).value;
                    selectedTeacher = altTeacher !== "" ? altTeacher : "معلم بديل آخر";
                }
                reportData[`class${i}_teacher`] = selectedTeacher;
            }

            try {
                const response = await fetch('/save-report', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(reportData)
                });
                const result = await response.json();

                if (result.success) {
                    clearAllInputs(); 
                    showNotification("تم حفظ بيانات غياب المعلم بنجاح !", "success"); 
                } else {
                    showNotification("خطأ أثناء الحفظ: " + result.error, "error");
                }
            } catch (err) { 
                showNotification("فشل الاتصال بالسيرفر", "error"); 
            }
        });

        async function loadClasses() {
            try {
                const response = await fetch('/get-classes');
                const classes = await response.json();
                for(let i=1; i<=7; i++) {
                    let roomSelect = document.getElementById(`roomSelect_${i}`);
                    classes.forEach(row => {
                        let opt = document.createElement('option');
                        opt.value = row["Name_class"];
                        opt.text = row["Name_class"];
                        roomSelect.appendChild(opt);
                    });
                }
            } catch (e) { console.error("خطأ في جلب الفصول"); }
        }

        async function loadAllTeachers() {
            try {
                const response = await fetch('/get-data');
                const teachers = await response.json();
                allTeachersList = teachers;

                const mainSelect = document.getElementById('teacherSelect');
                teachers.forEach(t => {
                    let opt = document.createElement('option');
                    opt.value = t["Name_teacher"];
                    opt.text = t["Name_teacher"];
                    mainSelect.appendChild(opt);
                });

                // تعبئة قائمة جميع المعلمين في القوائم الثانوية
                populateSecondaryTeacherSelects();
            } catch (e) { console.error("خطأ في جلب المعلمين"); }
        }

        function populateSecondaryTeacherSelects() {
            for (let i = 1; i <= 7; i++) {
                const secSelect = document.getElementById(`allTeacherSelect_${i}`);
                if (!secSelect) continue;
                
                secSelect.innerHTML = '<option value="">-- اختر المعلم --</option>';

                // تعبئة أسماء كافة معلمي المدرسة فقط
                allTeachersList.forEach(t => {
                    let opt = document.createElement('option');
                    opt.value = t["Name_teacher"];
                    opt.text = t["Name_teacher"];
                    secSelect.appendChild(opt);
                });
            }
        }

        async function loadWaitingTeachers(i) {
            const day = document.getElementById('daySelect').value;
            const roomSelect = document.getElementById(`roomSelect_${i}`);
            const teacherSelect = document.getElementById(`teacherSelect_${i}`);
            const secondarySelect = document.getElementById(`allTeacherSelect_${i}`);

            if (!day) { 
                showNotification("يرجى اختيار اليوم أولا", "error"); 
                roomSelect.value = ""; 
                return; 
            }
            if (roomSelect.value === "") { 
                teacherSelect.disabled = true; 
                if (secondarySelect) secondarySelect.style.display = "none";
                return; 
            }

            try {
                const response = await fetch(`/get-waiting-teachers?day=${day}&period=${i}`);
                const data = await response.json();
                
                teacherSelect.innerHTML = '<option value="">-- اختر المعلم البديل --</option>';

                // 1️⃣ إظهار المعلمين المتاحين فقط لهذه الحصة حسب الجدول
                if (data.teachers && data.teachers.length > 0) {
                    data.teachers.forEach(teacherCode => {
                        let opt = document.createElement('option');
                        opt.value = teacherCode;
                        opt.text = teacherCode; 
                        teacherSelect.appendChild(opt);
                    });
                }

                // 2️⃣ إدراج خيار "معلم بديل آخر" دائماً في الأسفل
                let optOther = document.createElement('option');
                optOther.value = "معلم بديل آخر";
                optOther.text = "معلم بديل آخر";
                teacherSelect.appendChild(optOther);

                teacherSelect.disabled = false;
                
                // إعادة إخفاء وتصفير القائمة الثانوية عند التغيير
                if (secondarySelect) {
                    secondarySelect.style.display = "none";
                    secondarySelect.value = "";
                }
            } catch (e) { 
                console.error("خطأ في جلب المعلمين البدلاء"); 
            }
        }

        function handleTeacherSelectChange(i) {
            const teacherSelect = document.getElementById(`teacherSelect_${i}`);
            const secondarySelect = document.getElementById(`allTeacherSelect_${i}`);
            
            if (teacherSelect.value === "معلم بديل آخر") {
                secondarySelect.style.display = "block";
            } else {
                secondarySelect.style.display = "none";
                secondarySelect.value = "";
            }
        }

        function checkAndEnableTeacher(i) { loadWaitingTeachers(i); }

        async function loadSchoolName() {
            try {
                const response = await fetch('/get-report-data');
                const data = await response.json();
                if (data.mainInfo && data.mainInfo.B2) {
                    document.getElementById('schoolName').textContent = "مدرسة " + data.mainInfo.B2;
                }
            } catch (e) {
                console.error("خطأ في جلب اسم المدرسة:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSchoolName();
            loadAllTeachers();
            loadClasses();
        });

        function clearAllInputs() {
            const selects = document.querySelectorAll('select');
            selects.forEach((select) => {
                select.value = ""; 
                select.selectedIndex = -1;
                if (typeof $ !== 'undefined' && $.fn.select2) {
                    $(select).val(null).trigger('change.select2'); 
                }
            });

            const inputs = document.querySelectorAll('input');
            inputs.forEach((input) => {
                if (input.type === 'text' || input.type === 'date' || input.type === 'number') {
                    input.value = '';
                }
            });

            // إخفاء كافة القوائم الثانوية للمعلمين
            for(let i=1; i<=7; i++) {
                const secSelect = document.getElementById(`allTeacherSelect_${i}`);
                if (secSelect) secSelect.style.display = "none";
            }
        }

        function showNotification(message, type = 'success') {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                stopOnFocus: true,
                style: {
                    background: type === 'success' 
                        ? "linear-gradient(to left, #2ecc71, #27ae60)" 
                        : "linear-gradient(to left, #e74c3c, #c0392b)",
                    borderRadius: "8px",
                    fontSize: "15px",
                    direction: "rtl",
                    boxShadow: "0 4px 12px rgba(0,0,0,0.15)"
                }
            }).showToast();
        }
    </script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-hijri-datepicker@1.0.2/dist/js/bootstrap-hijri-datetimepicker.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#hijriDate").hijriDatePicker({
                hijri: true,
                showSwitcher: false,
                format: 'iYYYY/iMM/iDD',
                hijriFormat: 'iYYYY/iMM/iDD',
                locale: 'ar-sa'
            });
        });
    </script>
</body>
</html>
