    <div class="main-container">
        
        <div class="card">
            <h3>استخراج تقرير الغياب</h3>
            <form id="reportForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>اختر اليوم:</label>
                        <select id="reportDay" required>
                            <option value="">-- اختر اليوم --</option>
                            <option value="الأحد">الأحد</option>
                            <option value="الاثنين">الاثنين</option>
                            <option value="الثلاثاء">الثلاثاء</option>
                            <option value="الأربعاء">الأربعاء</option>
                            <option value="الخميس">الخميس</option>
                        </select>
                    </div>
                    <div class="form-group" style="position: relative;">
                        <label>التاريخ (الهجري):</label>
                        <input type="text" id="hijriDate" class="form-control" placeholder="اختر التاريخ الهجري" autocomplete="off" required>                    </div>
                </div>
                <button type="button" onclick="generateReport()">عرض التقرير</button>
            </form>
        </div>

        <div class="card" id="reportResult" style="margin-top: 30px; display: none;">
            <table id="resultTable" style="display: none;">
                <thead>
                    <tr>
                        <th>أسماء المعلمين الغائبين</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button type="button" onclick="previewPDF()" style="background-color: #e74c3c;">طباعة التقرير  </button>
        </div>

    </div>

    <script>
        async function generateReport() {
    const selectedDay = document.getElementById('reportDay').value;
    
    // 1. جلب قيمة التاريخ الهجري من الحقل (سواء كان id هو hijriDate أو reportDate)
    const dateInput = document.getElementById('hijriDate') || document.getElementById('reportDate');
    let selectedDate = dateInput ? dateInput.value : '';

    // 2. تحويل الأرقام العربية إلى أرقام إنجليزية لضمان المطابقة مع الإكسيل
    if (selectedDate) {
        selectedDate = selectedDate.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    const res = await fetch('/get-report-data');
    const data = await res.json();
    
    // تم التعديل هنا لقراءة data.teachers
    const filteredData = data.teachers.filter(item => {
        const vals = Object.values(item);
        return vals[0] === selectedDate && vals[1] === selectedDay;
    });

    if (filteredData.length === 0) { showNotification("🔍 عذراً، لا توجد بيانات مسجلة لهذا اليوم", "error"); return; }
    
    const body = document.getElementById('tableBody');
    body.innerHTML = "";
    filteredData.forEach(row => { body.innerHTML += `<tr><td>${Object.values(row)[2] || '---'}</td></tr>`; });
    
    document.getElementById('resultTable').style.display = 'table';
    document.getElementById('reportResult').style.display = 'block';
}

 async function generateReport() {
    const selectedDay = document.getElementById('reportDay').value;
    
    // 1. جلب قيمة التاريخ الهجري من الحقل
    const dateInput = document.getElementById('hijriDate') || document.getElementById('reportDate');
    let selectedDate = dateInput ? dateInput.value : '';

    // 2. تحويل الأرقام لضمان مطابقتها للإكسيل (1448/01/28)
    if (selectedDate) {
        selectedDate = selectedDate.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    // 3. طباعة التاريخ في عنوان التقرير على الشاشة (إذا كان لديك عنصر لعرضه)
    const displayElement = document.getElementById('selectedDateDisplay') || document.getElementById('reportDateText');
    if (displayElement) {
        displayElement.innerText = selectedDate;
    }

    const res = await fetch('/get-report-data');
    const data = await res.json();
    
    // تصفية البيانات بمطابقة التاريخ الهجري واليوم
    const filteredData = data.teachers.filter(item => {
        const vals = Object.values(item);
        return vals[0] === selectedDate && vals[1] === selectedDay;
    });

    if (filteredData.length === 0) { 
       
        showNotification("🔍 عذراً، لا توجد بيانات مسجلة لهذا اليوم", "error"); 
        return; 
    }
    
    const body = document.getElementById('tableBody');
    body.innerHTML = "";
    filteredData.forEach(row => { 
        body.innerHTML += `<tr><td>${Object.values(row)[2] || '---'}</td></tr>`; 
    });
    
    document.getElementById('resultTable').style.display = 'table';
    document.getElementById('reportResult').style.display = 'block';
}
async function previewPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    const addBorder = () => {
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.5);
        doc.rect(5, 5, 200, 287);
    };
    addBorder();
    
    // جلب اليوم والتاريخ كنصوص مباشرة
    const dayElement = document.getElementById('reportDay');
    const day = dayElement ? dayElement.value : '';

    const dateInput = document.getElementById('hijriDate') || document.getElementById('reportDate');
    let date = dateInput ? dateInput.value.trim() : '';

    // معالجة الفواصل (/) لضمان ظهور التاريخ بشكل مرتب
    if (date) {
        date = date.replace(/\//g, ' - ');
    }   

    const res = await fetch('/get-report-data');
    const fullResponse = await res.json();
    const allData = fullResponse.teachers;
    const mainInfo = fullResponse.mainInfo;
    const rows = Array.from(document.querySelectorAll('#tableBody td'));

    // تحميل خط Noto Sans Arabic
    const fontData = await fetch('NotoSansArabic-Regular.ttf')
      .then(res => res.arrayBuffer());

    const fontBase64 = btoa(new Uint8Array(fontData).reduce((data, byte) => data + String.fromCharCode(byte), '' ));

    doc.addFileToVFS("NotoSansArabic-Regular.ttf", fontBase64);
    doc.addFont("NotoSansArabic-Regular.ttf", "Noto", "normal");
    doc.setFont("Noto", "normal");
    
    const img = new Image();
    img.src = 'logo.png';
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const imgData = canvas.toDataURL('image/png');

    doc.addImage(imgData, 'PNG', 70, 0, 70, 50);
    doc.setFontSize(12);
    doc.text("المملكة العربية السعودية - وزارة التعليم", 170, 15, { align: 'center' });
    doc.text("الإدارة العامة للتعليم بمنطقة" + (mainInfo.B1 || ""), 170, 21, { align: 'center' });
    doc.text("مدرسة" + (mainInfo.B2 || ""), 170, 27, { align: 'center' });
    doc.line(15, 35, 195, 35);

    let currentY = 43;
    const classCols = [3, 5, 7, 9, 11, 13, 15];
    const subCols = [4, 6, 8, 10, 12, 14, 16];

    rows.forEach((td) => {
        const teacherName = td.innerText;
        const teacherData = allData.find(item => Object.values(item)[2] === teacherName);

        if (currentY > 220) {
            doc.addPage();
            addBorder();
            currentY = 15;
        }

        // 1️⃣ طباعة النص محاذياً لليمن تماماً
        doc.setFontSize(10.5);
        doc.text(`إخواني المعلمين نظرًا لغياب المعلم: ${teacherName} لهذا اليوم ${day} الموافق ${date} هـ`, 195, currentY, { align: 'right' });
        doc.text("آمل تسديد مكانه في الحصص ، ولكم جزيل الشكر", 195, currentY + 6, { align: 'right' });

        // 2️⃣ تجهيز بيانات جدول الحصص
        const tableBody = [];
        for (let i = 0; i < 7; i++) {
            tableBody.push([
                '', '', 
                teacherData ? Object.values(teacherData)[subCols[i]] || '' : '', 
                '', 
                teacherData ? Object.values(teacherData)[classCols[i]] || '' : '', 
                (i + 1).toString()
            ]);
        }

        // 3️⃣ رسم جدول الحصص تحت النص مباشرة
        doc.autoTable({
            startY: currentY + 10,
            head: [['ما تم تنفيذه', 'التوقيع', 'المعلم المنتظر', 'المادة', 'الفصل', 'الحصة']],
            body: tableBody,
            theme: 'grid',
            columnStyles: { 0: {cellWidth: 35}, 1: {cellWidth: 25}, 2: {cellWidth: 40}, 3: {cellWidth: 30}, 4: {cellWidth: 30}, 5: {cellWidth: 20} },
            styles: {font: 'Noto', halign: 'center', cellPadding: 2, minCellHeight: 6, fontSize: 9, textColor: 0},
            headStyles: {fillColor: [44, 62, 80], textColor: 255, font: 'Noto', fontSize: 9, cellPadding: 1, minCellHeight: 5} 
        });

        currentY = doc.lastAutoTable.finalY + 12;
    });

    // إضافة التذييل
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFont("Noto");
        doc.setFontSize(11);
        
        // مدير المدرسة
        doc.text("مدير المدرسة", 40, 279, { align: 'center' });
        doc.text((mainInfo.B3 || ""), 40, 285, { align: 'center' });
        
        // وكيل المدرسة
        doc.text("وكيل المدرسة", 170, 279, { align: 'center' });
        doc.text((mainInfo.B4 || ""), 170, 285, { align: 'center' });
    }

    // 1️⃣ تنظيف اسم الملف من أي رموز قد تسبب مشكلة في التسمية
    const safeDay = day ? day.trim() : 'اليوم';
    const safeDate = date ? date.replace(/\s+/g, '') : 'التاريخ';
    
    // 2️⃣ صياغة اسم الملف (مثال: جدول_التكليف_الأحد_1448-01-28.pdf)
    const fileName = `جدول انتظار${safeDay} ${safeDate}.pdf`;

    // 3️⃣ تنزيل الملف مباشرة بالاسم المخصص
    doc.save(fileName);
}
        async function loadSchoolName() {
            try {
                const response = await fetch('/get-report-data');
                const data = await response.json();
                if (data.mainInfo && data.mainInfo.B2) {
                    document.getElementById('schoolName').textContent = "مدرسة " + data.mainInfo.B2;
                }
            } catch (e) {
                console.error("خطأ في جلب اسم المدرسة:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSchoolName(); // تفعيل جلب اسم المدرسة فقط
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-hijri-datepicker@1.0.2/dist/js/bootstrap-hijri-datetimepicker.min.js"></script>

<script>
    // تفعيل التقويم الهجري عند تحميل الصفحة
    $(document).ready(function () {
        $("#hijriDate").hijriDatePicker({
            hijri: true,
            showSwitcher: false,
            format: 'iYYYY/iMM/iDD',
            hijriFormat: 'iYYYY/iMM/iDD',
            locale: 'ar-sa'
        });
    });
    // دالة مخصصة لإظهار تنبيهات Toast أنيقة في صفحة التقارير
function showNotification(message, type = 'success') {
    Toastify({
        text: message,
        duration: 3000,          // تختفي تلقائياً بعد 3 ثوانٍ
        gravity: "top",          // تظهر من أعلى الشاشة
        position: "right",       // في جهة اليمين (مناسب للعربية)
        stopOnFocus: true,       
        style: {
            background: type === 'success' 
                ? "linear-gradient(to left, #2ecc71, #27ae60)" // أخضر للنجاح
                : "linear-gradient(to left, #e74c3c, #c0392b)", // أحمر للأخطاء
            borderRadius: "8px",
            fontSize: "15px",
            direction: "rtl",    // محاذاة النص من اليمين لليسار
            boxShadow: "0 4px 12px rgba(0,0,0,0.15)"
        }
    }).showToast();
}
</script>
