                <!-- خيارات "جدول" -->

                        <select id="reportDay" class="form-select">

                    <div class="mb-3" style="position: relative;">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment-hijri@2.1.2/moment-hijri.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-hijri-datepicker@1.0.2/dist/js/bootstrap-hijri-datetimepicker.min.js"></script>

<script>
    const weekNames = [
      "الأسبوع الأول", "الأسبوع الثاني", "الأسبوع الثالث", "الأسبوع الرابع",
      "الأسبوع الخامس", "الأسبوع السادس", "الأسبوع السابع", "الأسبوع الثامن",
      "الأسبوع التاسع", "الأسبوع العاشر", "الأسبوع الحادي عشر", "الأسبوع الثاني عشر",
      "الأسبوع الثالث عشر", "الأسبوع الرابع عشر", "الأسبوع الخامس عشر"
    ];
    const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];

    // 🔢 تحويل الأرقام الشرقية (٠-٩) إلى أرقام غربية (0-9)
    function toWesternDigits(str) {
        if (str === null || str === undefined) return '';
        return str.toString().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    // 🗓️ تنسيق التاريخ ليظهر من اليمين إلى اليسار (اليوم على اليمين ثم الشهر ثم السنة هـ)
    function formatHijriDate(rawDate) {
        if (!rawDate) return '';
        let str = toWesternDigits(rawDate).toString().trim().replace(/هـ/g, '').trim();
        if (!str) return '';

        let day = null, month = null, year = null;

        const parts = str.split(/[\/\-\.\s]+/);
        if (parts.length === 3) {
            let p1 = parseInt(parts[0], 10);
            let p2 = parseInt(parts[1], 10);
            let p3 = parseInt(parts[2], 10);

            if (!isNaN(p1) && !isNaN(p2) && !isNaN(p3)) {
                if (p1 > 1000) {
                    year = p1; month = p2; day = p3;
                } else if (p3 > 1000) {
                    day = p1; month = p2; year = p3;
                }
            }
        }

        if (!day || !month || !year) {
            if (typeof moment !== 'undefined') {
                let m = moment(str, [
                    'iYYYY/iM/iD', 'iYYYY-iM-iD', 'iYYYY/iMM/iDD', 'iYYYY-iMM-iDD',
                    'iD/iM/iYYYY', 'iD-iM-iYYYY', 'iDD/iMM/iYYYY', 'iDD-iMM-iDD',
                    'YYYY-MM-DD', 'YYYY/MM/DD', 'DD/MM/YYYY', 'DD-MM-YYYY'
                ], true);
                if (!m.isValid()) m = moment(str);
                if (m.isValid()) {
                    day = m.iDate();
                    month = m.iMonth() + 1;
                    year = m.iYear();
                }
            }
        }

        if (day && month && year) {
            return `${year}-${month}-${day} هـ`;
        }

        return str ? `${str} هـ` : '';
    }

    function normalizeArabicText(str) {
        if (!str) return '';
        return str.toString().trim().replace(/[أإآا]/g, 'ا').replace(/\s+/g, '');
    }

    function showToast(message, isError = false) {
        Toastify({
            text: message,
            duration: 3000,
            gravity: "top",
            position: "left",
            style: {
                background: isError ? "#dc3545" : "#198754",
                borderRadius: "8px",
                fontSize: "14px"
            }
        }).showToast();
    }

    function populateWeekSelect() {
        const sel = document.getElementById('weekSelect');
        sel.innerHTML = weekNames.map(w => `<option value="${w}">${w}</option>`).join('');
    }

    async function populateTeacherSelect() {
        try {
            const res = await fetch('/api/teachers');
            const teachers = await res.json();
            const sel = document.getElementById('teacherSelect');
            (Array.isArray(teachers) ? teachers : []).forEach(name => {
                if (!name) return;
                const opt = document.createElement('option');
                opt.value = name;
                opt.text = name;
                sel.appendChild(opt);
            });
        } catch (e) {
            console.error("خطأ في جلب أسماء المعلمين:", e);
        }
    }

    function toggleReportTypeSections() {
        const type = document.getElementById('reportType').value;
        document.getElementById('scheduleOptions').classList.toggle('d-none', type !== 'جدول');
        document.getElementById('reportOptions').classList.toggle('d-none', type !== 'تقرير');
    }

    function toggleRangeInputs() {
        const rangeType = document.getElementById('rangeType').value;
        document.getElementById('weekWrapper').classList.toggle('d-none', rangeType !== 'week');
        document.getElementById('monthWrapper').classList.toggle('d-none', rangeType !== 'month');
    }

    function getSelectedWeeks() {
        const rangeType = document.getElementById('rangeType').value;
        if (rangeType === 'all') return weekNames.slice();
        if (rangeType === 'week') {
            const val = document.getElementById('weekSelect').value;
            return val ? [val] : [];
        }
        if (rangeType === 'month') {
            const monthIndex = parseInt(document.getElementById('monthSelect').value);
            const startIdx = monthIndex * 4;
            const endIdx = Math.min(startIdx + 4, weekNames.length);
            return weekNames.slice(startIdx, endIdx);
        }
        return [];
    }

    async function loadSchoolName() {
        try {
            const response = await fetch('/get-report-data');
            const data = await response.json();
            if (data.mainInfo && data.mainInfo.B2) {
                document.getElementById('schoolName').textContent = "مدرسة " + toWesternDigits(data.mainInfo.B2);
            }
        } catch (e) {
            console.error("خطأ في جلب اسم المدرسة:", e);
        }
    }

    // ================= طباعة "جدول" المناوبة =================
    async function printScheduleTable() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const res = await fetch('/get-report-data');
        const fullResponse = await res.json();
        const mainInfo = fullResponse.mainInfo || {};

        try {
            const fontData = await fetch('NotoSansArabic-Regular.ttf').then(res => res.arrayBuffer());
            const fontBase64 = btoa(new Uint8Array(fontData).reduce((data, byte) => data + String.fromCharCode(byte), ''));
            doc.addFileToVFS("NotoSansArabic-Regular.ttf", fontBase64);
            doc.addFont("NotoSansArabic-Regular.ttf", "Noto", "normal");
            doc.setFont("Noto", "normal");
        } catch (e) {
            console.warn("تعذر تحميل الخط الخاص، سيتم استخدام الخط الافتراضي", e);
        }

        try {
            const img = new Image();
            img.src = 'logo.png';
            await img.decode();
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', 70, 0, 70, 50);
        } catch (e) {
            console.warn("لم يتم العثور على صورة الشعار logo.png");
        }

        doc.setFontSize(12);
        doc.text("المملكة العربية السعودية - وزارة التعليم", 170, 15, { align: 'center' });
        doc.text("الإدارة العامة للتعليم بمنطقة " + toWesternDigits(mainInfo.B1 || ""), 170, 21, { align: 'center' });
        doc.text("مدرسة " + toWesternDigits(mainInfo.B2 || ""), 170, 27, { align: 'center' });
        doc.line(15, 35, 195, 35);

        const selectedWeeks = getSelectedWeeks();
        if (selectedWeeks.length === 0) {
            showToast("يرجى تحديد نطاق صحيح للطباعة", true);
            return;
        }

        const rotRes = await fetch('/api/get-rotation');
        const rotationData = await rotRes.json();

        doc.setFontSize(14);
        doc.text("جدول المناوبة", 105, 42, { align: 'center' });

        const tableRows = [];
        selectedWeeks.forEach(weekName => {
            days.forEach(day => {
                const record = rotationData.find(r => r['الأسبوع'] === weekName && normalizeArabicText(r['اليوم']) === normalizeArabicText(day));
                tableRows.push([
                    toWesternDigits(record ? (record['المناوب'] || '') : ''),
                    formatHijriDate(record ? record['التاريخ'] : ''),
                    day,
                    toWesternDigits(weekName)
                ]);
            });
        });

        const fontName = doc.getFontList().Noto ? 'Noto' : 'helvetica';

        doc.autoTable({
            startY: 48,
            theme: 'grid',
            head: [['المناوب', 'التاريخ', 'اليوم', 'الأسبوع']],
            body: tableRows,
            styles: {
                font: fontName,
                halign: 'center',
                fontSize: 10,
                cellPadding: 3,
                textColor: [0, 0, 0],
                lineColor: [0, 0, 0],
                lineWidth: 0.2,
                fillColor: [255, 255, 255]
            },
            headStyles: {
                fillColor: [230, 230, 230],
                textColor: [0, 0, 0],
                fontStyle: 'bold',
                lineColor: [0, 0, 0],
                lineWidth: 0.2
            },
            alternateRowStyles: { fillColor: [255, 255, 255] },
            margin: { left: 15, right: 15 }
        });

        finishAndSaveSchedule(doc, mainInfo);
    }

    function finishAndSaveSchedule(doc, mainInfo) {
        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            
            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.5);
            doc.rect(5, 5, 200, 287);

            doc.setFontSize(11);
            doc.text("مدير المدرسة", 40, 275, { align: 'center' });
            doc.text(toWesternDigits(mainInfo.B3 || ""), 40, 281, { align: 'center' });
            doc.text("وكيل المدرسة", 170, 275, { align: 'center' });
            doc.text(toWesternDigits(mainInfo.B4 || ""), 170, 281, { align: 'center' });
        }

        const rangeType = document.getElementById('rangeType').value;
        const rangeLabel = rangeType === 'week'
            ? document.getElementById('weekSelect').value
            : rangeType === 'month'
                ? document.getElementById('monthSelect').selectedOptions[0].text
                : 'الكل';

        doc.save(`جدول المناوبة - ${toWesternDigits(rangeLabel)}.pdf`);
    }

    // ================= طباعة "تقرير" المناوبة =================
    async function printDutyReport() {
        const teacherName = document.getElementById('teacherSelect').value;
        const dayElement = document.getElementById('reportDay');
        const day = dayElement ? dayElement.value : '';
        const dateInput = document.getElementById('hijriDate');
        let date = dateInput ? formatHijriDate(dateInput.value.trim()) : '';

        if (!teacherName) {
            showToast("يرجى اختيار اسم المناوب أولاً", true);
            return;
        }
        if (!day) {
            showToast("يرجى اختيار اليوم", true);
            return;
        }
        if (!date) {
            showToast("يرجى تحديد التاريخ الهجري", true);
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        const res = await fetch('/get-report-data');
        const fullResponse = await res.json();
        const mainInfo = fullResponse.mainInfo || {};

        try {
            const fontData = await fetch('NotoSansArabic-Regular.ttf').then(res => res.arrayBuffer());
            const fontBase64 = btoa(new Uint8Array(fontData).reduce((data, byte) => data + String.fromCharCode(byte), ''));

            doc.addFileToVFS("NotoSansArabic-Regular.ttf", fontBase64);
            doc.addFont("NotoSansArabic-Regular.ttf", "Noto", "normal");
            doc.setFont("Noto", "normal");
        } catch (e) {
            console.warn("تعذر تحميل الخط الخاص، سيتم استخدام الخط الافتراضي", e);
        }

        try {
            const img = new Image();
            img.src = 'logo.png';
            await img.decode();
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', 70, 0, 70, 50);
        } catch (e) {
            console.warn("لم يتم العثور على صورة الشعار logo.png");
        }

        // ===== الهيدر العلوي =====
        doc.setFontSize(12);
        doc.text("المملكة العربية السعودية - وزارة التعليم", 170, 15, { align: 'center' });
        doc.text("الإدارة العامة للتعليم بمنطقة " + toWesternDigits(mainInfo.B1 || ""), 170, 21, { align: 'center' });
        doc.text("مدرسة " + toWesternDigits(mainInfo.B2 || ""), 170, 27, { align: 'center' });
        doc.line(15, 35, 195, 35);

        const fontName = doc.getFontList().Noto ? 'Noto' : 'helvetica';

        // ===== عنوان التقرير =====
        doc.setFontSize(15);
        doc.text("تقرير المناوبة", 105, 41, { align: 'center' });

        // ===== اليوم والتاريخ =====
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text(`اليوم : ${day}`, 185, 48, { align: 'right' });
        doc.text(`التاريخ : ${date}`, 110, 48, { align: 'right' });

        // ===== جدول اسم المناوب / التوقيع =====
        doc.autoTable({
            startY: 53,
            theme: 'grid',
            head: [['التوقيع', 'اسم المناوب']],
            body: [['', toWesternDigits(teacherName)]],
            styles: {
                font: fontName,
                halign: 'center',
                fontSize: 10,
                cellPadding: 3,
                textColor: [0, 0, 0],
                lineColor: [0, 0, 0],
                lineWidth: 0.2,
                fillColor: [255, 255, 255]
            },
            headStyles: {
                fillColor: [230, 230, 230],
                textColor: [0, 0, 0],
                fontStyle: 'bold',
                lineColor: [0, 0, 0],
                lineWidth: 0.2
            },
            alternateRowStyles: { fillColor: [255, 255, 255] },
            margin: { left: 15, right: 15 }
        });

        // ===== جدول الطلاب المتأخرين بالانصراف =====
        const lateStudentsBody = [];
        for (let i = 1; i <= 5; i++) {
            lateStudentsBody.push(['', '', '', String(i)]);
        }
        doc.autoTable({
            startY: doc.lastAutoTable.finalY + 6,
            theme: 'grid',
            head: [['ملاحظات', 'الإجراء', 'أسماء الطلاب المتأخرين بالانصراف', 'الرقم']],
            body: lateStudentsBody,
            styles: {
                font: fontName,
                halign: 'center',
                fontSize: 10,
                cellPadding: 3,
                minCellHeight: 8,
                textColor: [0, 0, 0],
                lineColor: [0, 0, 0],
                lineWidth: 0.2,
                fillColor: [255, 255, 255]
            },
            headStyles: {
                fillColor: [230, 230, 230],
                textColor: [0, 0, 0],
                fontStyle: 'bold',
                lineColor: [0, 0, 0],
                lineWidth: 0.2
            },
            alternateRowStyles: { fillColor: [255, 255, 255] },
            columnStyles: {
                3: { cellWidth: 15 }
            },
            margin: { left: 15, right: 15 }
        });

        // ===== جدول المخالفين سلوكياً =====
        const violationsBody = [];
        for (let i = 1; i <= 5; i++) {
            violationsBody.push(['', '', '', String(i)]);
        }
        doc.autoTable({
            startY: doc.lastAutoTable.finalY + 6,
            theme: 'grid',
            head: [['ملاحظات', 'الإجراء', 'المخالفين سلوكياً', 'الرقم']],
            body: violationsBody,
            styles: {
                font: fontName,
                halign: 'center',
                fontSize: 10,
                cellPadding: 3,
                minCellHeight: 8,
                textColor: [0, 0, 0],
                lineColor: [0, 0, 0],
                lineWidth: 0.2,
                fillColor: [255, 255, 255]
            },
            headStyles: {
                fillColor: [230, 230, 230],
                textColor: [0, 0, 0],
                fontStyle: 'bold',
                lineColor: [0, 0, 0],
                lineWidth: 0.2
            },
            alternateRowStyles: { fillColor: [255, 255, 255] },
            columnStyles: {
                3: { cellWidth: 15 }
            },
            margin: { left: 15, right: 15 }
        });

        // ===== إطار الصفحة والتوقيعات لكل الصفحات =====
        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);

            doc.setDrawColor(0, 0, 0);
            doc.setLineWidth(0.5);
            doc.rect(5, 5, 200, 287);

            doc.setFontSize(11);
            doc.text("مدير المدرسة", 40, 275, { align: 'center' });
            doc.text(toWesternDigits(mainInfo.B3 || ""), 40, 281, { align: 'center' });

            doc.text("وكيل المدرسة", 170, 275, { align: 'center' });
            doc.text(toWesternDigits(mainInfo.B4 || ""), 170, 281, { align: 'center' });
        }

        const safeDay = day ? day.trim() : 'اليوم';
        const safeDate = date ? date.replace(/[\/\s]/g, '-') : 'التاريخ';
        const fileName = `تقرير المناوبة - ${teacherName} - ${safeDay} ${safeDate}.pdf`;

        doc.save(fileName);
    }

    async function printReport() {
        const reportType = document.getElementById('reportType').value;
        if (!reportType) {
            showToast("يرجى اختيار نوع العرض أولاً", true);
            return;
        }
        if (reportType === 'جدول') {
            await printScheduleTable();
        } else {
            await printDutyReport();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadSchoolName();
        populateWeekSelect();
        populateTeacherSelect();
        toggleReportTypeSections();
        toggleRangeInputs();
        document.getElementById('reportType').addEventListener('change', toggleReportTypeSections);
        document.getElementById('rangeType').addEventListener('change', toggleRangeInputs);

        $("#hijriDate").hijriDatePicker({
            hijri: true,
            showSwitcher: false,
            format: 'iYYYY/iMM/iDD',
            hijriFormat: 'iYYYY/iMM/iDD',
            locale: 'ar-sa'
        }).on('dp.change change input', function () {
            this.value = toWesternDigits(this.value);
        });
    });
</script>

</body>
</html>
