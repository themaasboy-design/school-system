    <style>
        body {
            background-color: #f8f9fa;

            max-width: 600px;
            margin: 40px auto;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: #ffffff;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: #ffffff;
            padding: 16px 24px;
        }
        .card-header-custom h5 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .drop-zone {
            display: block;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 15px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .upload-icon {
            color: #3b82f6;
            margin-bottom: 10px;
        }
        .drop-title {
            margin: 0 0 6px 0;
            font-size: 0.95rem;
            color: #334155;
            font-weight: 500;
        }
        .drop-title span {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
        }
        .drop-hint {
            margin: 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .file-info-box {
            margin-bottom: 20px;
            padding: 12px 16px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #166534;
            font-size: 0.9rem;
        }
        .file-name {
            flex-grow: 1;
            margin: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .remove-file {
            cursor: pointer;
            font-size: 1.3rem;
            color: #dc2626;
            font-weight: bold;
            line-height: 1;
        }
        .btn-upload-custom {
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-upload-custom:hover {
            background-color: #059669;
            color: white;
        }
    </style>
</head>

<!-- 📦 حاوية كارت تحديث البيانات المباشر -->
<div class="container update-card-container">
    <div class="card card-custom">
        <div class="card-header-custom">
            <h5><i class="fas fa-file-excel me-2"></i> تحديث بيانات المدرسة</h5>
        </div>

        <div class="card-body p-4">
            <form id="updateExcelForm">
                
                <!-- منطقة السحب والإفلات -->
                <label for="excelFileInput" class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <div class="upload-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <path d="M12 12v6"/>
                                <path d="m15 15-3-3-3 3"/>
                            </svg>
                        </div>
                        <p class="drop-title">اسحب ملف الإكسل هنا أو <span>اضغط للاختيار</span></p>
                        <p class="drop-hint">يدعم الصيغ: .xlsx أو .xls</p>
                    </div>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls" required style="display: none;">
                </label>

                <!-- شريط عرض اسم الملف المختار -->
                <div id="fileSelectedInfo" class="file-info-box" style="display: none;">
                    <div>
                        <span>📊</span>
                        <span id="fileNameText" class="file-name">filename.xlsx</span>
                    </div>
                    <span class="remove-file" id="removeFileBtn" title="إزالة الملف">&times;</span>
                </div>

                <button type="submit" id="btnUploadExcel" class="btn btn-upload-custom w-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    رفع وتحديث البيانات
                </button>
            </form>
        </div>
    </div>
</div>

<!-- مكتبات التنبيهات والبوتستراب -->
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const fileInput = document.getElementById('excelFileInput');
    const fileInfoBox = document.getElementById('fileSelectedInfo');
    const fileNameText = document.getElementById('fileNameText');
    const removeFileBtn = document.getElementById('removeFileBtn');
    const dropZone = document.getElementById('dropZone');
    const updateExcelForm = document.getElementById('updateExcelForm');

    if (fileInput) {
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameText.textContent = this.files[0].name;
                fileInfoBox.style.display = 'flex';
            }
        });
    }

    if (removeFileBtn) {
        removeFileBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            fileInput.value = '';
            fileInfoBox.style.display = 'none';
        });
    }

    if (dropZone) {
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) {
                fileInput.files = files;
                fileNameText.textContent = files[0].name;
                fileInfoBox.style.display = 'flex';
            }
        });
    }

    if (updateExcelForm) {
        updateExcelForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];

            if (!file) {
                Toastify({ text: "يرجى اختيار ملف الأكسل أولاً", style: { background: "#e74c3c" } }).showToast();
                return;
            }

            const formData = new FormData();
            formData.append('excelFile', file);

            const submitBtn = document.getElementById('btnUploadExcel');
            submitBtn.disabled = true;
            submitBtn.innerHTML = "جاري التحديث...";

            try {
                const response = await fetch('/update-school-excel', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    Toastify({ 
                        text: "تم تحديث البيانات بنجاح!", 
                        style: { background: "#2bc48a" } 
                    }).showToast();
                    
                    fileInput.value = '';
                    fileInfoBox.style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1500);
                } else {
                    Toastify({ text: result.message || "حدث خطأ أثناء رفع الملف", style: { background: "#e74c3c" } }).showToast();
                }
            } catch (error) {
                console.error("Error:", error);
                Toastify({ text: "تعذر الاتصال بالسيرفر", style: { background: "#e74c3c" } }).showToast();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> رفع وتحديث البيانات`;
            }
        });
    }

    async function loadSchoolName() {
        try {
            const response = await fetch('/get-report-data');
            const data = await response.json();
            if (data.mainInfo && data.mainInfo.B2) {
                document.getElementById('schoolName').textContent = "مدرسة " + data.mainInfo.B2;
            }
        } catch (e) {
            console.error("خطأ في جلب اسم المدرسة:", e);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadSchoolName();
    });
</script>
